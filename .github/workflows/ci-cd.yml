name: CI/CD Pipeline - PTB-MN

on: 
  push:
    branches:
      - master

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # Dummy values so config.py can be imported during tests without a real .env
      TELEGRAM: "0:test"
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DATABASE_URL_NN: "postgresql://test:test@localhost:5432/test"
      DATABASE_URL_TEST: "postgresql://test:test@localhost:5432/test"
      DEEPL: "test"
      CHANNEL_MEME: "-1000000000001"
      CHANNEL_SOURCE: "-1000000000002"
      LOG_GROUP_ID: "-1000000000003"
      PROTOCOL_CHAT: "-1000000000004"
      ADMINS: "[]"
      OPENROUTER_API_KEY: "test"
      BEARER_DE: "test"
      BEARER_EN: "test"
      TESTING: "true"
      RES_PATH: "./res"
      # Twitter access tokens must contain a dash (pytwitter splits on it to get user ID)
      CONSUMER_KEY_DE: "test"
      CONSUMER_SECRET_DE: "test"
      ACCESS_KEY_DE: "0000000000000000000-test"
      ACCESS_SECRET_DE: "test"
      CONSUMER_KEY_EN: "test"
      CONSUMER_SECRET_EN: "test"
      ACCESS_KEY_EN: "0000000000000000000-test"
      ACCESS_SECRET_EN: "test"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: | 
        python -m pip install --upgrade pip
        pip install -r bot/requirements.txt

    - name: Run unit tests
      run: |
        cd bot
        python -m pytest ../test/ -v --tb=short

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}:latest